<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santos de la Iglesia Católica — Liturgia de las Horas</title>
    <link rel="icon" href="../img/ico-laudes.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <style>
        :root {
            --color-santo-azul: #0277bd;
            --color-borde: #dce7ee;
        }
        body {
            padding: 20px 10px 90px;
            background: #f4f8fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #263238;
        }
        .contenedor-santo {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px 18px;
            box-shadow: 0 4px 20px rgba(2, 119, 189, 0.12);
            border: 1px solid var(--color-borde);
        }
        .header-santo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid var(--color-santo-azul);
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .header-santo h1 {
            margin: 0;
            color: var(--color-santo-azul);
            font-size: 1.6rem;
        }
        .header-santo p {
            margin: 4px 0 0;
            color: #607d8b;
            font-size: 0.95rem;
        }
        .header-acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-accion-santo {
            background: var(--color-santo-azul);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-accion-santo:hover {
            background: #01579b;
        }
        .btn-accion-secundario {
            background: #eceff1;
            color: #37474f;
        }
        .btn-accion-secundario:hover {
            background: #cfd8dc;
        }
        .filtros-barra {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .filtros-barra select,
        .filtros-barra input {
            padding: 8px 12px;
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .filtros-barra input {
            flex: 1;
            min-width: 200px;
            max-width: 340px;
        }
        .tabla-wrapper {
            overflow-x: auto;
            border: 1px solid var(--color-borde);
            border-radius: 10px;
        }
        table.tabla-santos-anual {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 900px;
        }
        table.tabla-santos-anual th,
        table.tabla-santos-anual td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f6;
        }
        table.tabla-santos-anual th {
            background: #eef6fa;
            color: #0277bd;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        table.tabla-santos-anual tbody tr:hover {
            background: #f7fafc;
        }
        table.tabla-santos-anual tbody tr.fila-hoy {
            background: #e0f2fe !important;
            font-weight: 600;
        }
        .badge-dia {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            background: #eceff1;
            color: #455a64;
        }
        .badge-domingo {
            background: #ffebee;
            color: #c62828;
        }
        .select-santo {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--color-borde);
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            background: #ffffff;
            color: #263238;
        }
        .select-santo:focus {
            border-color: var(--color-santo-azul);
        }
        .dato-auto {
            color: #546e7a;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px; /* Alrededor de 10-12 caracteres */
        }
        .santo-info-link {
            color: var(--color-santo-azul);
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: transparent;
            transition: text-decoration-color 0.2s;
        }
        .santo-info-link:hover {
            text-decoration-color: var(--color-santo-azul);
        }
        /* Modal Detalle Santo */
        .modal-overlay-santo {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-content-santo {
            background: #fff;
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-close-santo {
            position: absolute;
            top: 14px; right: 16px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #78909c;
            line-height: 1;
        }
        .modal-close-santo:hover { color: #37474f; }
        .btn-guardar-flotante {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 22px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 99;
        }
        .btn-guardar-flotante:hover {
            background: #1b5e20;
        }
        .admin-toggle-btn {
            background: #fff;
            border: 1.5px solid var(--color-santo-azul);
            color: var(--color-santo-azul);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .admin-toggle-btn.activo {
            background: var(--color-santo-azul);
            color: #fff;
        }
        .auth-badge-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eef5f9;
            border: 1px solid var(--color-borde);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.82rem;
        }
        .btn-auth-action {
            background: #fff;
            border: 1px solid var(--color-santo-azul);
            color: var(--color-santo-azul);
            border-radius: 14px;
            padding: 3px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-auth-action:hover {
            background: var(--color-santo-azul);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="contenedor-santo">
        <div class="header-santo">
            <div>
                <h1>Santos de la Iglesia Católica</h1>
                <p>Asignación de santos para cada día del año (1 de enero - 31 de diciembre)</p>
            </div>
            <div class="header-acciones">
                <div class="auth-badge-container" id="auth-status-container">
                    <span class="material-symbols-outlined" style="font-size: 16px; color: var(--color-santo-azul);">account_circle</span>
                    <span id="auth-user-label" style="font-weight: 500;">Verificando...</span>
                    <button type="button" class="btn-auth-action" id="btn-auth-login" onclick="iniciarSesionAdmin()" style="display: none;">Iniciar Sesión</button>
                    <button type="button" class="btn-auth-action" id="btn-auth-logout" onclick="cerrarSesionAdmin()" style="display: none;">Salir</button>
                </div>
                <button type="button" class="btn-accion-santo" onclick="subirAsignacionesAFirebaseDirecto()" title="Subir catálogo y asignaciones a Firebase Cloud Firestore" style="background: #0288d1; color: white;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">cloud_upload</span>
                    Subir a Firebase
                </button>
                <a href="nombresanto.html" class="btn-accion-santo" id="btn-ir-nombresanto" style="display: none;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">person_add</span>
                    Crear / Editar Santo
                </a>
                <a href="../../index.html" class="btn-accion-santo btn-accion-secundario">
                    <span class="material-symbols-outlined" style="font-size: 18px;">home</span>
                    Inicio
                </a>
            </div>
        </div>

        <div class="filtros-barra">
            <div>
                <label for="filtro-mes" style="font-weight: 600; margin-right: 6px;">Mes:</label>
                <select id="filtro-mes">
                    <option value="todos">Todo el año (365 días)</option>
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>
            <input type="text" id="buscador-santo" placeholder="Buscar fecha, día o santo...">
        </div>

        <div class="tabla-wrapper">
            <table class="tabla-santos-anual">
                <thead>
                    <tr>
                        <th style="width: 100px;">Fecha</th>
                        <th style="width: 120px;">Día</th>
                        <th style="min-width: 220px;">Nombre del Santo (Select)</th>
                        <th>País</th>
                        <th>Realidad</th>
                        <th style="width: 120px;">Nacimiento</th>
                        <th style="width: 120px;">Mortalidad</th>
                    </tr>
                </thead>
                <tbody id="tbody-santos-anual"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Lectura Detalle del Santo -->
    <div class="modal-overlay-santo" id="modal-detalle-santo" onclick="if(event.target===this) cerrarModalDetalleSanto()">
        <div class="modal-content-santo">
            <span class="modal-close-santo" onclick="cerrarModalDetalleSanto()">&times;</span>
            <h2 id="modal-santo-nombre" style="margin-top: 0; color: var(--color-santo-azul); font-size: 1.35rem; border-bottom: 2px solid #e1f5fe; padding-bottom: 8px;"></h2>
            <div id="modal-santo-cuerpo" style="display: flex; flex-direction: column; gap: 12px; font-size: 0.93rem; color: #37474f;"></div>
        </div>
    </div>

    <button type="button" class="btn-guardar-flotante" id="btn-guardar-asignaciones">
        <span class="material-symbols-outlined">save</span> Guardar Asignaciones
    </button>

    <script src="../js/navigator.js" type="module"></script>
    <script type="module">
        import { catalogoSantosAnual } from '../data/catalogoSantosAnual.js';

        const STORAGE_SANTOS_CATALOGO = 'lh_catalogo_nombres_santos';
        const STORAGE_ASIGNACIONES = 'lh_santos_calendario_anual';

        const mesesNombres = [
            'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
        ];

        const diasSemanaNombres = [
            'DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'
        ];

        function obtenerCatalogoSantos() {
            const mapa = new Map();
            // 1. Cargar santos predeterminados del catálogo litúrgico anual
            if (Array.isArray(catalogoSantosAnual)) {
                catalogoSantosAnual.forEach(s => {
                    if (s && s.nombre) mapa.set(s.nombre.toLowerCase().trim(), s);
                });
            }
            // 2. Cargar/sobrescribir con lo almacenado en LocalStorage (modificaciones, fotos subidas, etc.)
            try {
                const locales = JSON.parse(localStorage.getItem(STORAGE_SANTOS_CATALOGO)) || [];
                locales.forEach(s => {
                    if (s && s.nombre) {
                        const clave = s.nombre.toLowerCase().trim();
                        const previo = mapa.get(clave);
                        mapa.set(clave, previo ? { ...previo, ...s, imagen: s.imagen || previo.imagen || '' } : s);
                    }
                });
            } catch (e) {
                console.warn("Error al leer STORAGE_SANTOS_CATALOGO:", e);
            }
            return Array.from(mapa.values());
        }

        function obtenerAsignaciones() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_ASIGNACIONES)) || {};
            } catch (e) {
                return {};
            }
        }

        function guardarAsignaciones(mapa) {
            localStorage.setItem(STORAGE_ASIGNACIONES, JSON.stringify(mapa));
            if (window.firebaseAPI && window.firebaseAPI.guardarAsignacionesFirestore && modoAdminSanto) {
                window.firebaseAPI.guardarAsignacionesFirestore(mapa).then(() => {
                    console.log("☁️ [Firestore] Asignaciones de santos subidas a Firebase.");
                }).catch(err => {
                    console.error("❌ Error al guardar asignaciones en Firebase:", err);
                });
            }
        }

        function normalizarClaveFecha(str) {
            if (!str || typeof str !== 'string') return null;
            const m = str.trim().match(/^(\d{1,2})[\/\-](\d{1,2})/);
            if (m) {
                const dia = parseInt(m[1], 10);
                const mes = parseInt(m[2], 10);
                if (dia >= 1 && dia <= 31 && mes >= 1 && mes <= 12) {
                    return dia + '/' + mes;
                }
            }
            return null;
        }

        const anioActual = 2026;
        const diasDelAnio = [];
        const inicio = new Date(anioActual, 0, 1);
        const fin = new Date(anioActual, 11, 31);

        for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate() + 1)) {
            const diaNum = d.getDate();
            const mesNum = d.getMonth() + 1;
            const diaSemanaIndex = d.getDay();
            const diaSemana = diasSemanaNombres[diaSemanaIndex];
            const clave = diaNum + '/' + mesNum;

            diasDelAnio.push({
                clave,
                diaNum,
                mesNum,
                mesNombre: mesesNombres[mesNum - 1],
                diaSemana,
                esDomingo: diaSemanaIndex === 0,
                fechaTexto: diaNum + ' de ' + mesesNombres[mesNum - 1]
            });
        }

        let asignaciones = obtenerAsignaciones();

        // Cargar asignaciones automáticas basadas en fechaFestividad o mortalidad del catálogo de santos
        function autoAsignarSantosPorFecha() {
            const catalogoCompleto = obtenerCatalogoSantos();
            if (!catalogoCompleto || catalogoCompleto.length === 0) return false;

            let huboCambios = false;
            catalogoCompleto.forEach(s => {
                if (!s || !s.nombre) return;
                const claveFest = normalizarClaveFecha(s.fechaFestividad);
                const claveMuerte = normalizarClaveFecha(s.muerte);
                const claveDestino = claveFest || claveMuerte;

                if (claveDestino && !asignaciones[claveDestino]) {
                    asignaciones[claveDestino] = s.nombre;
                    huboCambios = true;
                }
            });

            if (huboCambios) {
                guardarAsignaciones(asignaciones);
            }
            return huboCambios;
        }

        autoAsignarSantosPorFecha();

        const hoy = new Date();
        const claveHoy = hoy.getDate() + '/' + (hoy.getMonth() + 1);

        const ADMIN_EMAIL = 'dbaezh78@gmail.com';
        let modoAdminSanto = false; // Solo true si está logueado dbaezh78@gmail.com

        function actualizarEstadoAdmin(user) {
            const label = document.getElementById('auth-user-label');
            const btnLogin = document.getElementById('btn-auth-login');
            const btnLogout = document.getElementById('btn-auth-logout');
            const btnCrear = document.getElementById('btn-ir-nombresanto');
            const btnGuardar = document.getElementById('btn-guardar-asignaciones');

            if (user && user.email) {
                const esAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
                modoAdminSanto = esAdmin;
                if (label) {
                    label.textContent = esAdmin ? `Admin: ${user.email}` : `Lector: ${user.email}`;
                    label.style.color = esAdmin ? '#0277bd' : '#546e7a';
                }
                if (btnLogin) btnLogin.style.display = 'none';
                if (btnLogout) btnLogout.style.display = 'inline-block';
                if (btnCrear) btnCrear.style.display = esAdmin ? 'inline-flex' : 'none';
                if (btnGuardar) btnGuardar.style.display = esAdmin ? 'flex' : 'none';
            } else {
                modoAdminSanto = false;
                if (label) {
                    label.textContent = 'Modo Lectura (Público)';
                    label.style.color = '#546e7a';
                }
                if (btnLogin) btnLogin.style.display = 'inline-block';
                if (btnLogout) btnLogout.style.display = 'none';
                if (btnCrear) btnCrear.style.display = 'none';
                if (btnGuardar) btnGuardar.style.display = 'none';
            }
        }

        window.iniciarSesionAdmin = async function() {
            if (window.firebaseAPI && window.firebaseAPI.login) {
                try {
                    const res = await window.firebaseAPI.login();
                    const u = res.user;
                    if (u && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                        alert(`¡Bienvenido Administrador (${u.email})! Modo edición activado.`);
                    } else {
                        alert(`Sesión iniciada como ${u ? u.email : 'usuario'}. Permisos en Modo Lectura.`);
                    }
                } catch (err) {
                    console.error("Error al iniciar sesión:", err);
                    alert("Error al iniciar sesión: " + (err.message || err));
                }
            } else {
                alert("El servicio de Firebase aún se está cargando, por favor intenta en unos segundos.");
            }
        };

        window.subirAsignacionesAFirebaseDirecto = async function() {
            if (!window.firebaseAPI || !window.firebaseAPI.guardarAsignacionesFirestore) {
                alert("⚠️ Firebase no se ha cargado totalmente. Espera un momento y reintenta.");
                return;
            }
            try {
                // 1. Subir asignaciones
                await window.firebaseAPI.guardarAsignacionesFirestore(asignaciones);
                // 2. Subir también catálogo de santos si está disponible
                const catalogo = obtenerCatalogoSantos();
                if (window.firebaseAPI.guardarSantosFirestore && catalogo && catalogo.length > 0) {
                    await window.firebaseAPI.guardarSantosFirestore(catalogo);
                }
                alert("🎉 ¡Éxito total! Catálogo y Asignaciones subidas correctamente a la base de datos de Firebase Cloud Firestore.");
            } catch (err) {
                alert("❌ Error al subir a Firebase: " + (err.message || err));
                console.error("Firebase Sync Error:", err);
            }
        };

        window.cerrarSesionAdmin = async function() {
            if (window.firebaseAPI && window.firebaseAPI.logout) {
                try {
                    await window.firebaseAPI.logout();
                    alert("Sesión cerrada. Regresando a Modo Lectura.");
                } catch (err) {
                    console.error("Error al salir:", err);
                }
            }
        };

        // Escuchar estado de autenticación
        function verificarAuthInicial() {
            if (window.firebaseAPI && window.firebaseAPI.onAuthReady) {
                window.firebaseAPI.onAuthReady(async (user) => {
                    actualizarEstadoAdmin(user);
                    if (window.firebaseAPI.cargarAsignacionesFirestore) {
                        try {
                            const asigRemotas = await window.firebaseAPI.cargarAsignacionesFirestore();
                            if (asigRemotas && typeof asigRemotas === 'object') {
                                asignaciones = asigRemotas;
                                localStorage.setItem(STORAGE_ASIGNACIONES, JSON.stringify(asigRemotas));
                            }
                        } catch(e) {
                            console.warn("⚠️ No se pudieron cargar asignaciones desde Firestore:", e);
                        }
                    }
                    autoAsignarSantosPorFecha();
                    renderTabla();
                });
            } else {
                setTimeout(verificarAuthInicial, 300);
            }
        }
        verificarAuthInicial();

        function renderTabla() {
            const filtroMes = document.getElementById('filtro-mes').value;
            const filtroBusqueda = document.getElementById('buscador-santo').value.toLowerCase().trim();
            const tbody = document.getElementById('tbody-santos-anual');
            const santosDisponibles = obtenerCatalogoSantos();

            let html = '';

            diasDelAnio.forEach(d => {
                if (filtroMes !== 'todos' && String(d.mesNum) !== filtroMes) return;

                const santoAsignadoNombre = asignaciones[d.clave] || '';
                const santoObj = santosDisponibles.find(s => s.nombre.toLowerCase() === santoAsignadoNombre.toLowerCase());

                const coincideBusqueda = !filtroBusqueda || 
                    d.fechaTexto.toLowerCase().includes(filtroBusqueda) ||
                    d.diaSemana.toLowerCase().includes(filtroBusqueda) ||
                    santoAsignadoNombre.toLowerCase().includes(filtroBusqueda) ||
                    (santoObj && (
                        (santoObj.pais && santoObj.pais.toLowerCase().includes(filtroBusqueda)) ||
                        (santoObj.realidad && santoObj.realidad.toLowerCase().includes(filtroBusqueda))
                    ));

                if (!coincideBusqueda) return;

                const esHoy = d.clave === claveHoy;
                const pais = santoObj ? (santoObj.pais || '-') : '-';
                const realidad = santoObj ? (santoObj.realidad || '-') : '-';
                const nacimiento = santoObj ? (santoObj.nacimiento || '-') : '-';
                const muerte = santoObj ? (santoObj.muerte || '-') : '-';

                let celdaSantoHtml = '';
                if (modoAdminSanto) {
                    const opcionesHtml = santosDisponibles.map(s => {
                        const sel = s.nombre === santoAsignadoNombre ? 'selected' : '';
                        return '<option value="' + s.nombre + '" ' + sel + '>' + s.nombre + '</option>';
                    }).join('');

                    celdaSantoHtml = '<select class="select-santo" data-clave="' + d.clave + '" onchange="cambiarSanto(this)">' +
                                        '<option value="">-- Sin santo asignado --</option>' +
                                        opcionesHtml +
                                     '</select>';
                } else {
                    celdaSantoHtml = santoAsignadoNombre
                        ? '<span class="santo-info-link" onclick="verDetallePorNombre(\'' + santoAsignadoNombre.replace(/'/g, "\\'") + '\')">' + santoAsignadoNombre + '</span>'
                        : '<span class="santo-sin-asignar">— Sin santo asignado —</span>';
                }

                const clickModal = santoObj ? 'onclick="verDetallePorNombre(\'' + santoAsignadoNombre.replace(/'/g, "\\'") + '\')"' : '';

                html += '<tr class="' + (esHoy ? 'fila-hoy' : '') + '" data-clave="' + d.clave + '">' +
                    '<td><strong>' + d.diaNum + ' ' + d.mesNombre.substring(0, 3) + '</strong></td>' +
                    '<td><span class="badge-dia ' + (d.esDomingo ? 'badge-domingo' : '') + '">' + d.diaSemana + '</span></td>' +
                    '<td>' + celdaSantoHtml + '</td>' +
                    '<td class="dato-auto col-pais ' + (santoObj ? 'santo-info-link' : '') + '" ' + clickModal + '>' + pais + '</td>' +
                    '<td class="dato-auto col-realidad ' + (santoObj ? 'santo-info-link' : '') + '" ' + clickModal + '>' + realidad + '</td>' +
                    '<td class="dato-auto col-nacimiento ' + (santoObj ? 'santo-info-link' : '') + '" ' + clickModal + '>' + nacimiento + '</td>' +
                    '<td class="dato-auto col-mortalidad ' + (santoObj ? 'santo-info-link' : '') + '" ' + clickModal + '>' + muerte + '</td>' +
                '</tr>';
            });

            tbody.innerHTML = html || '<tr><td colspan="7" style="text-align:center; padding: 20px; color:#888;">No se encontraron resultados</td></tr>';
        }

        window.verDetallePorNombre = function(nombreSanto) {
            const santos = obtenerCatalogoSantos();
            const s = santos.find(item => item.nombre.toLowerCase() === nombreSanto.toLowerCase());
            if (!s) return;

            document.getElementById('modal-santo-nombre').textContent = s.nombre || 'Detalle del Santo';
            
            const hijosList = (s.hijos && s.hijos.length > 0)
                ? s.hijos.map(h => `<span class="tag-hijo">${h}</span>`).join(' ')
                : '—';

            const imgModal = s.imagen 
                ? `<div style="text-align:center; margin-bottom:12px;"><img src="${s.imagen}" style="max-height:160px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.15);" alt="${s.nombre}"></div>` 
                : '';

            document.getElementById('modal-santo-cuerpo').innerHTML = `
                ${imgModal}
                <div><strong>Nacimiento:</strong> ${s.nacimiento || '—'}</div>
                <div><strong>Mortalidad:</strong> ${s.muerte || '—'}</div>
                <div><strong>País:</strong> ${s.pais || '—'}</div>
                <div><strong>Ciudad:</strong> ${s.ciudad || '—'}</div>
                <div><strong>Realidad:</strong> ${s.realidad || '—'}</div>
                <div><strong>Hijos en la fe:</strong> <div style="margin-top:4px;">${hijosList}</div></div>
                ${s.historia ? `<div style="border-top: 1px solid #eceff1; padding-top: 10px;"><strong>Historia:</strong><p style="margin: 4px 0 0; line-height: 1.4;">${s.historia}</p></div>` : ''}
                ${s.detalle ? `<div style="border-top: 1px solid #eceff1; padding-top: 10px;"><strong>Detalle:</strong><p style="margin: 4px 0 0; line-height: 1.4;">${s.detalle}</p></div>` : ''}
            `;

            document.getElementById('modal-detalle-santo').style.display = 'flex';
        };

        window.cerrarModalDetalleSanto = function() {
            document.getElementById('modal-detalle-santo').style.display = 'none';
        };

        window.cambiarSanto = function(select) {
            if (!modoAdminSanto) {
                alert('No tienes permisos para modificar asignaciones.');
                return;
            }
            const clave = select.getAttribute('data-clave');
            const valor = select.value;
            const fila = select.closest('tr');
            const santosDisponibles = obtenerCatalogoSantos();
            const santoObj = santosDisponibles.find(s => s.nombre === valor);

            if (valor) {
                asignaciones[clave] = valor;
            } else {
                delete asignaciones[clave];
            }

            fila.querySelector('.col-pais').textContent = santoObj ? (santoObj.pais || '-') : '-';
            fila.querySelector('.col-realidad').textContent = santoObj ? (santoObj.realidad || '-') : '-';
            fila.querySelector('.col-nacimiento').textContent = santoObj ? (santoObj.nacimiento || '-') : '-';
            fila.querySelector('.col-mortalidad').textContent = santoObj ? (santoObj.muerte || '-') : '-';

            guardarAsignaciones(asignaciones);
        };

        document.getElementById('btn-guardar-asignaciones').addEventListener('click', () => {
            if (!modoAdminSanto) {
                alert('No tienes permisos para guardar asignaciones.');
                return;
            }
            guardarAsignaciones(asignaciones);
            alert('✅ Asignaciones de santos guardadas correctamente.');
        });

        document.getElementById('filtro-mes').addEventListener('change', renderTabla);
        document.getElementById('buscador-santo').addEventListener('input', renderTabla);

        const mesActualNum = String(hoy.getMonth() + 1);
        document.getElementById('filtro-mes').value = mesActualNum;

        renderTabla();
    </script>
</body>
</html>
